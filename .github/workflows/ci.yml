name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint all PHP files
        run: find app config database routes -name "*.php" -exec php -l {} \; | grep -v "No syntax errors" || echo "all PHP files OK"

  php-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, gd, bcmath, intl
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction
      - name: Check Zenith commands register
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php artisan list | grep -q "zenith:watchdog" && echo "✓ watchdog"
          php artisan list | grep -q "zenith:notify" && echo "✓ notifier"
          php artisan list | grep -q "zenith:mover" && echo "✓ mover"
          php artisan list | grep -q "zenith:announce" && echo "✓ announce"
          php artisan list | grep -q "zenith:logo" && echo "✓ logo"
          php artisan list | grep -q "zenith:discord-setup" && echo "✓ discord-setup"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build (v2 = npm/vite, v1 = yarn/webpack)
        run: |
          if [ -f package-lock.json ]; then
            npm config set allow-scripts=true --location=user || true
            npm install --legacy-peer-deps || npm install
            npm run build:production
          else
            npm install -g yarn
            yarn install --no-progress || yarn install --no-progress --ignore-engines
            yarn build:production
          fi
